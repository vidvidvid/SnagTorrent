[package]
name = "snag-torrent"
version = "0.1.0"
edition = "2024"
description = "A tiny, private BitTorrent client"
repository = "https://github.com/vidvidvid/SnagTorrent"
readme = "README.md"
license = "Apache-2.0"

[[bin]]
name = "snag"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
